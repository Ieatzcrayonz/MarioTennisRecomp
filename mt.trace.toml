# N64Recomp config for Mario Tennis (USA) [NM8E].
# Inputs are produced by: python tools/gen_symbols.py "<path to Mario Tennis (USA).z64>"

[input]
# The cartridge boot stub at 0x80300000 LZ-decompresses main into 0x80031000 and jumps there.
# The runtime does that step natively, so recompilation starts at main.
entrypoint = 0x80031000
output_func_path = "RecompiledFuncs"
symbols_file_path = "syms/mt.us.syms.toml"
rom_file_path = "build_assets/mt.us.recomp.z64"

[patches]
stubs = [
]

# Replaced by hand in src/game/mt_libultra.cpp (see tools/libultra_names.py).
ignored = [
    "func_80031C4C",
    "func_80032D20",
    "func_800332DC",
    "func_80048F38",
    "func_80049224",
    "func_80049388",
    "func_80049554",
    "func_8004960C",
    "func_80049950",
]

# Segment loader (func_80035CC0(rom, dest, compressed_size)): after decompression, just before
# its osWritebackDCache(dest, size) call, tell the runtime which segment landed where so the
# matching recompiled overlay becomes callable. dest is in $a0, the decompressed size in $fp.
# The loader advances its saved ROM pointer while streaming, so the start offset is recorded on
# entry (per thread) and paired with the destination/size at the end.
[[patches.hook]]
func = "func_80035CC0"
before_vram = 0x80035CC0
text = "    { void mt_loader_begin(uint32_t rom); mt_loader_begin((uint32_t)ctx->r4); }"

[[patches.hook]]
func = "func_80035CC0"
before_vram = 0x80035EF4
text = "    { void mt_on_segment_loaded(uint8_t* rdram, uint32_t rom, uint32_t dest, uint32_t size); mt_on_segment_loaded(rdram, (uint32_t)MEM_W(0x2104, ctx->r29), (uint32_t)ctx->r4, (uint32_t)ctx->r30); }"

# Diagnostics: report bzero/memset calls whose range leaves RDRAM (0x80000000-0x80800000).
[[patches.hook]]
func = "func_80033240"
before_vram = 0x80033240
text = "    { void mt_check_range(const char*, uint32_t, uint32_t, uint32_t); mt_check_range(\"bzero\", (uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r31); }"

[[patches.hook]]
func = "func_80033244"
before_vram = 0x80033244
text = "    { void mt_check_range(const char*, uint32_t, uint32_t, uint32_t); mt_check_range(\"fill\", (uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r31); }"

# KSEG1 (uncached) RDRAM pointers -> KSEG0. The runtime's memory macros only cover KSEG0, and
# caching has no meaning for recompiled code (Zelda64Recomp patches its kseg1 users the same way).
# Boot clears 0xA0100000-0xA0400000.
[[patches.instruction]]
func = "func_80031164"
vram = 0x80031174
value = 0x3C048010 # lui $a0, 0xA010 -> lui $a0, 0x8010

# Framebuffer pointers built as osVirtualToPhysical(fb) + 0xA0000000.
[[patches.instruction]]
func = "func_800357B4"
vram = 0x800357E0
value = 0x3C108000 # lui $s0, 0xA000 -> lui $s0, 0x8000

[[patches.instruction]]
func = "func_80035A44"
vram = 0x80035A68
value = 0x3C038000 # lui $v1, 0xA000 -> lui $v1, 0x8000

# Diagnostics: log the game's osViSetEvent(mq, msg, retrace_count) arguments.
[[patches.hook]]
func = "func_80031420"
before_vram = 0x800316BC
text = "    { void mt_log3(const char*, uint32_t, uint32_t, uint32_t); mt_log3(\"osViSetEvent(mq, msg, count)\", (uint32_t)ctx->r4, 0x29A, (uint32_t)ctx->r18 & 0xFF); }"


# Diagnostics: messages received by the game's VI thread (func_80032304).
[[patches.hook]]
func = "func_80032304"
before_vram = 0x80032348
text = "    { void mt_log3(const char*, uint32_t, uint32_t, uint32_t); static int n = 0; if (n++ < 5) mt_log3(\"VI thread got msg\", (uint32_t)MEM_W(0x10, ctx->r29), 0, n); }"

# SPIN-HOOKS BEGIN (generated by tools/find_spins.py -- do not edit by hand)
# Busy-waits yield to the cooperative scheduler so SP/DP/VI events can be delivered.
[[patches.hook]] # polls 0x80061F6C
func = "func_80031D60"
before_vram = 0x80031D90
text = "    { void yield_self_1ms(uint8_t* rdram); yield_self_1ms(rdram); }"

[[patches.hook]] # polls 0x80062608
func = "func_seg78_80100010"
before_vram = 0x80100018
text = "    { void yield_self_1ms(uint8_t* rdram); yield_self_1ms(rdram); }"

# SPIN-HOOKS END

